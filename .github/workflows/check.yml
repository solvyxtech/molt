name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # The engine's suite, with coverage in source coordinates. The window
      # checks (self-check, e2e) need a display and run in `npm run check`
      # locally; the bar in .molt/done.yml runs all four.
      - run: npm test
      - name: CLI binary smoke
        run: |
          # npm test already built dist/; rebuild only if missing
          test -x dist/cli.js || npm run build
          node dist/cli.js --help
          node dist/cli.js --version
          # doctor may exit >1 when default localhost endpoint is down (no Ollama in CI)
          node dist/cli.js doctor || true
