name: check

on:
  push:
    branches: [main]
  # Stacked PRs target claude/* branches, not main; both get the checks
  # (privsep-linux included).
  pull_request:
    branches: [main, "claude/**"]

jobs:
  typecheck-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # The engine's suite, with coverage in source coordinates. The window
      # checks (self-check, e2e) need a display and run in `npm run check`
      # locally; the bar in .molt/done.yml runs all four.
      - run: npm test
      - name: CLI binary smoke
        run: |
          # npm test already built dist/; rebuild only if missing
          test -x dist/cli.js || npm run build
          node dist/cli.js --help
          node dist/cli.js --version
          # doctor may exit >1 when default localhost endpoint is down (no Ollama in CI)
          node dist/cli.js doctor || true

  # The full suite on Linux, where /bin/sh is dash: macOS's /bin/sh is bash,
  # and a check that reads a shell's own wording (dash's "eval: x: not found")
  # passed there and failed here (#49 status sweep, N2).
  test-linux:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # Privilege separation (--worker-user, --check-user, --worker-strict) is
  # Linux-first and needs root to switch users: its tests skip on macOS and
  # run here, in a root container. The test creates its own worker and check
  # users. The container gets CAP_SYS_ADMIN, so the worker's PID namespace and
  # each check run's PID namespace and private /tmp can be made, and
  # MAAT_TEST_REQUIRE_PIDNS=1 makes the namespace tests fail here rather than
  # skip when they are not. Docker's default AppArmor profile on Ubuntu hosts
  # denies mount(2) (needed for the namespace's own /proc and the check's
  # tmpfs /tmp) even with the capability, so it is lifted for this container.
  privsep-linux:
    runs-on: ubuntu-latest
    container:
      image: node:22-bookworm
      options: --cap-add=SYS_ADMIN --security-opt apparmor=unconfined
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      MAAT_TEST_REQUIRE_PIDNS: "1"
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run test:build && npm run build
      # The job container's HOME is /github/home, a runner bind mount the
      # worker can read and root does not own, so Maat (correctly) refuses it
      # as the judge's HOME. root's own HOME is private.
      - run: node --test --test-reporter=spec dist-test/test/privsep.test.js
        env:
          HOME: /root
